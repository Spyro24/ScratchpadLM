# TinyLM Configuration
# All values can be overridden via config.yaml or config.json

model:
  vocab_size: 1000
  ctx: 50
  emb: 50
  hidden: 50

training:
  steps: 100
  lr: 0.05
  batch_size: 16
  n_negatives: 256
  workers: 4

generation:
  n_tokens: 60
  temperature: 0.8

tokenizer:
  vocab_size: 1000
  min_frequency: 2