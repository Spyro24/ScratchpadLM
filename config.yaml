# TinyLM Configuration
# All values can be overridden via config.yaml or config.json

model:
  vocab_size: 10000
  ctx: 2000
  emb: 5
  hidden: 25

training:
  steps: 100
  lr: 0.05
  batch_size: 16
  n_negatives: 256
  workers: 4
  lr_scheduler: cosine_warmup
  warmup_steps: 100
  min_lr: 0.0
  grad_clip: 1.0
  val_split: 0.1
  eval_every: 50
  early_stopping: true
  patience: 5
  min_delta: 0.0001
  checkpoint_every: 100
  checkpoint_dir: checkpoints
  auto_adjust: true
  auto_factor: 0.5
  auto_patience: 10
  auto_clip_relax: true
  momentum: 0.9

generation:
  n_tokens: 60
  temperature: 0.8
  top_k: 0
  top_p: 0.0
  repetition_penalty: 1.0

tokenizer:
  vocab_size: 1000
  min_frequency: 2
